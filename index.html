<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sklad</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- VIEW: SKENOVAT -->
  <section class="view" id="view-scan">
    <div id="reader"></div>
    <button id="startScanBtn" class="btn-primary">Skenovat kód</button>
    <button id="stopScanBtn" class="btn-secondary hidden">Zastavit skenování</button>

    <div id="product-card" class="hidden">

      <div class="photo-upload">
        <img id="photoPreview" class="hidden">
        <div id="photoPlaceholder">Přidat fotku</div>
        <input type="file" id="photoInput" accept="image/*" capture="environment">
      </div>

      <div id="knownProduct" class="hidden">
        <h2 id="productName">-</h2>
        <p class="meta-line">Kód <span id="scannedCode"></span></p>
        <div class="field-row">
          <span>Cena</span>
          <span id="productPrice">- Kč</span>
        </div>
        <div class="field-row">
          <span>Na skladě</span>
          <span id="currentStock">0 ks</span>
        </div>
        <input type="number" id="qtyInput" value="1" min="1">
        <div class="action-row">
          <button id="stockInBtn" class="btn-in">+ Příjem</button>
          <button id="stockOutBtn" class="btn-out">− Výdej</button>
        </div>
      </div>

      <div id="newProduct" class="hidden">
        <p class="meta-line">Nový kód, založ produkt</p>
        <input type="text" id="newName" placeholder="Název produktu">
        <input type="number" id="newPrice" placeholder="Cena (Kč)">
        <input type="number" id="newQty" placeholder="Počáteční stav (ks)" value="0">
      </div>

      <label class="field-label" for="categorySelect">Kategorie</label>
      <select id="categorySelect"></select>

      <div id="newProductSubmit" class="hidden">
        <button id="createProductBtn" class="btn-primary">Založit produkt</button>
      </div>

      <button id="cancelBtn" class="btn-text">Zrušit</button>
    </div>
  </section>

  <!-- VIEW: SKLAD -->
  <section class="view hidden" id="view-sklad">
    <input type="text" id="searchInput" placeholder="Hledat produkt…">
    <div id="categoryFilter"></div>
    <div id="productsGrid"></div>
    <p id="emptyStock" class="empty-state hidden">Zatím žádné produkty. Naskenuj první kód v Skenovat.</p>
  </section>

  <!-- VIEW: FAKTURA -->
  <section class="view hidden" id="view-faktura">
    <p class="empty-state">Fakturace se doplní podle zadání – zatím tu nic není.</p>
  </section>

</div>

<nav id="bottom-nav">
  <button class="nav-btn active" data-view="view-scan">
    <span class="nav-icon">▣</span>
    <span>Skenovat</span>
  </button>
  <button class="nav-btn" data-view="view-sklad">
    <span class="nav-icon">▦</span>
    <span>Sklad</span>
  </button>
  <button class="nav-btn" data-view="view-faktura">
    <span class="nav-icon">▤</span>
    <span>Faktura</span>
  </button>
</nav>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
